<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Song Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #111e2b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #00f2fe;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #203a43;
            border-radius: 8px;
            background: #1b2836;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]::placeholder {
            color: #8a9ba8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00f2fe;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #4facfe;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #8a9ba8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>YouTube Song Downloader</h2>
        <input type="text" id="videoUrl" placeholder="YouTube සින්දු ලින්ක් එක මෙතනට දාන්න...">
        <button onclick="getSongLink()">Get MP3 Link</button>
        
        <div id="status"></div>
    </div>

    <script>
        function getSongLink() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const statusDiv = document.getElementById('status');

            if (!urlInput) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "කරුණාකර YouTube ලින්ක් එකක් ඇතුළත් කරන්න!";
                return;
            }

            const videoIdMatch = urlInput.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            
            if (!videoIdMatch || !videoIdMatch[1]) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "වලංගු නොවන YouTube ලින්ක් එකකි!";
                return;
            }

            const videoId = videoIdMatch[1];

            statusDiv.style.color = "#51cf66";
            statusDiv.innerText = "සින්දුව සූදානම් කරමින් පවතී...";

            // කිසිදු සර්වර් එරර් එකක් නොඑන ලෙස, කෙලින්ම MP3 කන්වර්ටර් සේවා පිටුවට යොමු කිරීම
            setTimeout(() => {
                window.location.href = `https://www.y2mate.is/youtube/${videoId}`;
            }, 1000);
        }
    </script>

</body>
</html>
