<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="py-6 text-center border-b border-slate-800">
        <h1 class="text-3xl font-extrabold tracking-wider text-red-500">
            <i class="fa-brands fa-youtube mr-2"></i>YT Downloader
        </h1>
        <p class="text-slate-400 text-sm mt-1">Download your favorite YouTube videos instantly</p>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 max-w-xl my-auto py-10">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">
            <div class="mb-4">
                <label class="block text-slate-300 text-sm font-medium mb-2">Paste YouTube Link Here:</label>
                <div class="flex gap-2">
                    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 text-sm">
                    <button onclick="getDownloadLink()" id="btnText" 
                        class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-semibold transition duration-200 cursor-pointer text-sm shrink-0">
                        Search
                    </button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loader" class="hidden text-center py-6">
                <i class="fa-solid fa-spinner fa-spin text-red-500 text-3xl"></i>
                <p class="text-slate-400 text-xs mt-2">Fetching video details...</p>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="hidden mt-6 p-4 bg-slate-950 border border-slate-800 rounded-xl text-center">
                <p class="text-green-400 font-medium mb-3 text-sm"><i class="fa-solid fa-circle-check mr-1"></i> Video found successfully!</p>
                <a id="downloadBtn" href="#" target="_blank" 
                    class="inline-block bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold transition duration-200 text-sm w-full">
                    <i class="fa-solid fa-download mr-2"></i> Download Video
                </a>
            </div>

            <!-- Error Box -->
            <div id="errorBox" class="hidden mt-6 p-4 bg-red-950/40 border border-red-800/60 rounded-xl text-center text-red-400 text-sm">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="errorText">Something went wrong!</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-slate-500 text-xs border-t border-slate-900">
        Powered by Your Custom Vercel API &copy; 2026
    </footer>

    <!-- JavaScript Script -->
    <script>
        async function getDownloadLink() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const downloadBtn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('btnText');

            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            if (!urlInput) {
                errorText.innerText = "Please enter a valid YouTube URL!";
                errorBox.classList.remove('hidden');
                return;
            }

            loader.classList.remove('hidden');
            btnText.disabled = true;

            try {
                // ඔයාගේ Vercel API ලින්ක් එක මෙතනට දාලා තියෙනවා
                const apiUrl = `https://youtube-api-vercle.vercel.app/download?url=${encodeURIComponent(urlInput)}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                loader.classList.add('hidden');
                btnText.disabled = false;

                if (data.success && data.download_url) {
                    downloadBtn.href = data.download_url;
                    resultBox.classList.remove('hidden');
                } else {
                    errorText.innerText = data.error || "Could not fetch download link!";
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                loader.classList.add('hidden');
                btnText.disabled = false;
                errorText.innerText = "Connection failed. Please try again.";
                errorBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
