<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #0f1c3f;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #e43f5a;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #1f4068;
            border-radius: 8px;
            background: #162447;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]::placeholder {
            color: #a7a9be;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e43f5a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #d0314d;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #a7a9be;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>YouTube Downloader</h2>
        <input type="text" id="videoUrl" placeholder="YouTube ලින්ක් එක මෙතනට දාන්න...">
        <button onclick="redirectToDownload()">Get Download Link</button>
        <div id="status"></div>
    </div>

    <script>
        function redirectToDownload() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const statusDiv = document.getElementById('status');

            if (!urlInput) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "කරුණාකර YouTube ලින්ක් එකක් ඇතුළත් කරන්න!";
                return;
            }

            // යූටියුබ් ලින්ක් එකක්දැයි පරීක්ෂා කිරීම
            const videoIdMatch = urlInput.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            
            if (!videoIdMatch || !videoIdMatch[1]) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "වලංගු නොවන YouTube ලින්ක් එකකි!";
                return;
            }

            statusDiv.style.color = "#51cf66";
            statusDiv.innerText = "වීඩියෝ එක සූදානම් කරමින් පවතී...";

            // කිසිදු එරර් එකක් නොමැතිව, දුන් ලින්ක් එක සමඟ කෙලින්ම ඩවුන්ලෝඩ් සේවා පිටුවට යැවීම
            const encodedUrl = encodeURIComponent(urlInput);
            setTimeout(() => {
                window.location.href = `https://vidssave.com/?url=${encodedUrl}`;
            }, 1000);
        }
    </script>

</body>
</html>
