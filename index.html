<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct YouTube MP3 Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #111e2b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #00f2fe;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #203a43;
            border-radius: 8px;
            background: #1b2836;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00f2fe;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #4facfe;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #8a9ba8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Direct MP3 Downloader</h2>
        <input type="text" id="videoUrl" placeholder="YouTube ලින්ක් එක මෙතනට දාන්න...">
        <button id="downloadBtn" onclick="startDownload()">Download MP3</button>
        <div id="status"></div>
    </div>

    <script>
        async function startDownload() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!urlInput) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "කරුණාකර YouTube ලින්ක් එකක් ඇතුළත් කරන්න!";
                return;
            }

            statusDiv.style.color = "#8a9ba8";
            statusDiv.innerText = "ფိုင် එක සූදානම් කරමින් පවතී, රැඳී සිටින්න...";
            downloadBtn.disabled = true;

            try {
                // ඔබේම Vercel API එකෙන් ලින්ක් එක ලබා ගැනීම
                const response = await fetch(`/api/download?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                downloadBtn.disabled = false;

                if (data.success && data.download_url) {
                    statusDiv.style.color = "#51cf66";
                    statusDiv.innerText = "ඩවුන්ලෝඩ් වීම ආරම්භ වේ...";

                    // වෙනත් සයිට් එකකට නොගොස්, බ్రව්සර් එකෙන්ම කෙලින්ම ෆයිල් එක ඩවුන්ලෝඩ් කිරීම
                    const a = document.createElement('a');
                    a.href = data.download_url;
                    a.download = 'song.mp3';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                } else {
                    statusDiv.style.color = "#ff6b6b";
                    statusDiv.innerText = "දෝෂයක් සිදු විය: " + (data.error || "අසාර්ථකයි");
                }
            } catch (err) {
                downloadBtn.disabled = false;
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "සර්වර් දෝෂයක් සිදු විය.";
            }
        }
    </script>

</body>
</html>
