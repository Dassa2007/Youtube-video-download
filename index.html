<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #0f1c3f;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #e43f5a;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #1f4068;
            border-radius: 8px;
            background: #162447;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]::placeholder {
            color: #a7a9be;
        }
        button, .download-btn {
            width: 100%;
            padding: 12px;
            background: #e43f5a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }
        button:hover, .download-btn:hover {
            background: #d0314d;
        }
        .download-btn {
            background: #27ae60;
            margin-top: 10px;
        }
        .download-btn:hover {
            background: #219653;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #a7a9be;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>YouTube Downloader</h2>
        <input type="text" id="videoUrl" placeholder="YouTube ලින්ක් එක මෙතනට දාන්න...">
        <button id="searchBtn" onclick="getVideoLink()">Get Download Link</button>
        
        <div id="status"></div>

        <!-- ඩවුන්ලෝඩ් ලින්ක් එක ලැබුණු පසු පෙන්වන බටන් එක -->
        <a id="finalDownloadBtn" href="#" target="_blank" class="download-btn hidden">Click Here to Download</a>
    </div>

    <script>
        async function getVideoLink() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const finalBtn = document.getElementById('finalDownloadBtn');
            const searchBtn = document.getElementById('searchBtn');

            finalBtn.classList.add('hidden');

            if (!urlInput) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "කරුණාකර YouTube ලින්ක් එකක් ඇතුළත් කරන්න!";
                return;
            }

            statusDiv.style.color = "#a7a9be";
            statusDiv.innerText = "ලින්ක් එක සකස් කරමින් පවතී, රැඳී සිටින්න...";
            searchBtn.disabled = true;

            try {
                const apiResponse = await fetch(`https://youtube-api-vercle.vercel.app/download?url=${encodeURIComponent(urlInput)}`);
                const data = await apiResponse.json();

                searchBtn.disabled = false;

                if (data.success && data.download_url) {
                    statusDiv.style.color = "#51cf66";
                    statusDiv.innerText = "වීඩියෝ එක සූදානම්!";
                    
                    // ඩවුන්ලෝඩ් බටන් එකට ලින්ක් එක ඇතුළත් කර එය පෙන්වීම
                    finalBtn.href = data.download_url;
                    finalBtn.classList.remove('hidden');
                } else {
                    statusDiv.style.color = "#ff6b6b";
                    statusDiv.innerText = "දෝෂයක් සිදු විය: " + (data.error || "අසාර්ථකයි");
                }
            } catch (err) {
                searchBtn.disabled = false;
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "සර්වර් දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.";
            }
        }
    </script>

</body>
</html>
